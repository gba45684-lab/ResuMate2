<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ResuMate</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff;color:#181a1f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#ota-status{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.ota-card{max-width:420px}.ota-title{font-size:22px;font-weight:700;margin-bottom:8px}.ota-text{font-size:14px;line-height:1.5;color:#666}.ota-error{margin-top:12px;font-size:12px;color:#a33;white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
<div id="ota-status"><div class="ota-card"><div class="ota-title">ResuMate</div><div class="ota-text" id="ota-text">Starting ResuMate…</div><div class="ota-error" id="ota-error"></div></div></div>
<script>
(function(){
  'use strict';
  // The previous loader pointed at /ota/version.json and /ota/index.html,
  // but those paths do not exist in the repository. That left the app on
  // the loader screen (or an invalid fallback), so the Home UI could not
  // receive its normal click handlers.
  const APP_URL='https://raw.githubusercontent.com/gba45684-lab/ResuMate2/main/www/app-source.html';
  const LOCAL_APP='app-source.html';
  const CACHE_KEY='resumate.ota.bundle.v2';
  const text=document.getElementById('ota-text');
  const error=document.getElementById('ota-error');
  const setStatus=(s,e)=>{text.textContent=s;if(e)error.textContent=e};
  const readCache=()=>{try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){return null}};
  const writeCache=(h)=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({html:h}))}catch(_){} };
  function run(html){
    document.open();
    document.write(html);
    document.close();
  }
  async function load(){
    const cached=readCache();
    try{
      setStatus('Checking for the latest ResuMate update…');
      const stamp=Date.now();
      const response=await fetch(APP_URL+'?t='+stamp,{cache:'no-store'});
      if(!response.ok) throw new Error('Update bundle HTTP '+response.status);
      const html=await response.text();
      if(!html||html.length<1000) throw new Error('Update bundle is empty or incomplete');
      writeCache(html);
      run(html);
      return;
    }catch(e){
      if(cached&&cached.html){
        setStatus('Offline mode — using the last verified update.');
        setTimeout(()=>run(cached.html),80);
        return;
      }
      try{
        setStatus('Starting the bundled version…');
        const fallback=await fetch(LOCAL_APP,{cache:'no-store'});
        if(!fallback.ok) throw new Error('Bundled app HTTP '+fallback.status);
        const html=await fallback.text();
        if(!html||html.length<1000) throw new Error('Bundled app is empty or incomplete');
        run(html);
      }catch(f){
        setStatus('ResuMate could not start.',String(e&&e.message||e)+'\n'+String(f&&f.message||f));
      }
    }
  }
  load();
})();
</script>
</body>
</html>
