<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161A20">
<meta name="description" content="ResuMate - Professional Resume Builder">
<title>ResuMate &mdash; Resume Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/hover.css/2.3.1/css/hover-min.css">
<style>
html, body { width: 100%; height: 100%; }
:root {
  --paper:#F3EEDE;--paper2:#E7DFC5;--ink:#161A20;--soft:#585F68;--faint:#8B9198;
  --navy:#1D3450;--navy2:#28496B;--brass:#9C7C3E;--brass-deep:#6E552A;
  --forest:#3C5C4C;--forest2:#DEE7DE;--rust:#8B4638;--rust2:#EFDFDA;
  --line:rgba(22,26,32,.16);--card:#FFFFFF;--shadow:0 22px 46px rgba(10,12,16,.34);
  --resume-font:Inter,system-ui,sans-serif;--resume-text:#161A20;--resume-heading:#161A20;
  --safe-area-inset-top: env(safe-area-inset-top);
  --safe-area-inset-bottom: env(safe-area-inset-bottom);
  --safe-area-inset-left: env(safe-area-inset-left);
  --safe-area-inset-right: env(safe-area-inset-right);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(ellipse at 50% -14%, #24314a 0%, #0c0e13 64%);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  color: var(--ink);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
.rig {
  max-width: 100%;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.screen {
  height: 100%;
  width: 100%;
  background: var(--paper);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: max(0px, var(--safe-area-inset-top)) max(0px, var(--safe-area-inset-right)) max(0px, var(--safe-area-inset-bottom)) max(0px, var(--safe-area-inset-left));
}
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 30px 12px 60px 12px;
}
.phone { display: none; }
.label { display: none; }
.notch { display: none; }
.status { padding-top: max(8px, var(--safe-area-inset-top)); }
.bar { padding: 8px 18px 13px; }
.nav { padding-bottom: max(8px, var(--safe-area-inset-bottom)); }

/* Responsive Typography */
@media (max-width: 600px) {
  body { font-size: 14px; }
  .hero { font-size: 20px; }
  .content { padding: 16px 10px 60px; }
}
@media (max-width: 480px) {
  body { font-size: 13px; }
  .hero { font-size: 18px; }
  .content { padding: 12px 8px 50px; }
}

/* Rest of CSS from original */
.label{text-align:center;color:#b9c0cc;font:11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;opacity:.85}
.brand{font:600 21px 'Fraunces',Georgia,serif}
.brand b{color:var(--brass-deep);font-weight:600}
.tag{font:10px 'IBM Plex Mono',monospace;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.content{flex:1;overflow:auto}
.view{display:none}
.view.active{display:block}
.pad{padding:19px 19px 30px}
h1,h2,h3,h4,p{margin-top:0}
.serif{font-family:'Fraunces',Georgia,serif}
.eyebrow{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:12.5px;color:var(--brass-deep)}
.hero{font:500 26px 'Fraunces',Georgia,serif;line-height:1.16;margin:6px 0 18px;letter-spacing:-.005em}
button{font:inherit;cursor:pointer;color:inherit}
.primary{width:100%;border:0;border-left:4px solid var(--brass);background:var(--navy);color:var(--paper);border-radius:4px;padding:14px 15px 14px 13px;font-weight:600;text-align:left}
.primary small{display:block;font-weight:400;opacity:.75;margin-top:3px;font-size:11px}
.outline{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:10px;font-weight:600;font-size:11px}
.outline:active{background:var(--paper2)}
.danger{color:var(--rust)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:13px;min-height:90px}
.card strong{display:block;font-size:13px;margin-bottom:4px;font-weight:600}
.card small{font-size:10.5px;color:var(--soft);line-height:1.4}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 11px;margin-bottom:8px}
.nav{display:flex;border-top:1px solid var(--line);background:var(--paper);flex-shrink:0}
.nav button{flex:1;border:0;border-top:2px solid transparent;background:none;padding:9px 2px 10px;color:var(--faint);font-size:9.5px;min-width:0}
.nav button.active{color:var(--navy);font-weight:700;border-top-color:var(--brass)}
.nav i{display:block;font-size:17px;font-style:normal;margin-bottom:3px}
.dark{--paper:#151920;--paper2:#1E242C;--ink:#EEEAE0;--soft:#ADB4BE;--faint:#767D88;--card:#1A1F27;--line:rgba(255,255,255,.13)}

@media(max-width:430px){.grid{grid-template-columns:1fr}}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
@media print{body>*{display:none!important}#printArea{display:block!important}}
</style>
</head>
<body data-premium-preview="free">
<div class="rig">
<div class="screen" id="screen">
<div class="status"><span>9:41</span><span>LTE · 100%</span></div>
<div class="bar"><div class="brand">Resu<b>Mate</b></div><div><div class="tag" id="tag">Home</div></div></div>
<div class="content">
<section class="view active" id="home">
  <div class="pad">
    <h2 class="serif">ResuMate</h2>
    <p>Professional Resume Builder for Android</p>
    <button class="primary" onclick="alert('App Loaded Successfully!')">
      Get Started
      <small>Build your resume now</small>
    </button>
  </div>
</section>
<section class="view" id="builder"><div class="pad"><h2>Builder</h2><p>Resume builder coming soon...</p></div></section>
<section class="view" id="templates"><div class="pad"><h2>Templates</h2><p>Templates coming soon...</p></div></section>
<section class="view" id="settings"><div class="pad"><h2>Settings</h2><p>Settings coming soon...</p></div></section>
</div>
<div class="nav">
  <button id="nav-home" class="active" onclick="go('home')"><i class="fa-solid fa-house"></i></button>
  <button id="nav-builder" onclick="go('builder')"><i class="fa-solid fa-pen"></i></button>
  <button id="nav-templates" onclick="go('templates')"><i class="fa-solid fa-folder"></i></button>
  <button id="nav-settings" onclick="go('settings')"><i class="fa-solid fa-gear"></i></button>
</div>
</div>
</div>

<script>
function go(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  document.getElementById('nav-' + view).classList.add('active');
  document.getElementById('tag').textContent = view.charAt(0).toUpperCase() + view.slice(1);
}

// Prevent zoom on double tap
let lastTouchEnd = 0;
document.addEventListener('touchend', function(event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);

// Handle safe area changes (device rotation, etc)
window.addEventListener('orientationchange', () => {
  document.documentElement.style.height = window.innerHeight + 'px';
});

// Status bar color on Android
if (window.StatusBar) {
  StatusBar.styleDefault();
  StatusBar.hide();
}

// Prevent back button default behavior
document.addEventListener('backbutton', () => {
  if (confirm('Exit ResuMate?')) {
    navigator.app.exitApp();
  }
}, false);

console.log('ResuMate APK loaded successfully on', navigator.userAgent);
</script>
</body>
</html>
