<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ResuMate</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff;color:#181a1f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#ota-status{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.ota-card{max-width:420px}.ota-title{font-size:22px;font-weight:700;margin-bottom:8px}.ota-text{font-size:14px;line-height:1.5;color:#666}.ota-error{margin-top:12px;font-size:12px;color:#a33;white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
<div id="ota-status"><div class="ota-card"><div class="ota-title">ResuMate</div><div class="ota-text" id="ota-text">Connecting to the latest ResuMate…</div><div class="ota-error" id="ota-error"></div></div></div>
<script>
(function(){
'use strict';
const VERSION_URL='https://raw.githubusercontent.com/gba45684-lab/ResuMate2/ota/version.json';
const APP_URL='https://raw.githubusercontent.com/gba45684-lab/ResuMate2/ota/index.html';
const CACHE_KEY='resumate.ota.bundle.v6';
const ACTIVE_KEY='resumate.ota.active.v2';
const FALLBACK='fallback.html';
const text=document.getElementById('ota-text'),error=document.getElementById('ota-error');
const status=s=>text.textContent=s;
const read=()=>{try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){return null}};
const write=(version,html)=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({version,html,savedAt:Date.now()}));localStorage.setItem(ACTIVE_KEY,version)}catch(_) {}};
async function sha256(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function run(html){document.open();document.write(html);document.close()}
function installDynamicUpdater(html){
 const updater='<script>(function(){"use strict";const V='+JSON.stringify(VERSION_URL)+',A='+JSON.stringify(APP_URL)+',K='+JSON.stringify(CACHE_KEY)+',AK='+JSON.stringify(ACTIVE_KEY)+',INTERVAL=300000;async function hash(v){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,"0")).join("")}async function update(){try{const t=Date.now(),m=await fetch(V+"?t="+t,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("manifest "+r.status);return r.json()});if(!m.otaVersion||!m.sha256)return;const current=localStorage.getItem(AK);if(current===m.otaVersion)return;const h=await fetch(A+"?v="+encodeURIComponent(m.otaVersion)+"&t="+t,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("bundle "+r.status);return r.text()});if((await hash(h)).toLowerCase()!==String(m.sha256).toLowerCase())throw Error("integrity");localStorage.setItem(K,JSON.stringify({version:m.otaVersion,html:h,savedAt:Date.now()}));localStorage.setItem(AK,m.otaVersion);location.reload()}catch(_){}}setTimeout(update,30000);setInterval(update,INTERVAL)})();<\/script>';
 return html.includes('</body>')?html.replace('</body>',updater+'</body>'):html+updater;
}
async function load(){
 const cached=read();
 try{
  status('Checking for the latest ResuMate update…');
  const t=Date.now(),r=await fetch(VERSION_URL+'?t='+t,{cache:'no-store'});if(!r.ok)throw Error('Update manifest HTTP '+r.status);
  const m=await r.json();if(!m.otaVersion||!m.sha256)throw Error('Invalid update manifest');
  if(cached&&cached.version===m.otaVersion&&cached.html){run(installDynamicUpdater(cached.html));return}
  status('Downloading the latest ResuMate update…');
  const a=await fetch(APP_URL+'?v='+encodeURIComponent(m.otaVersion)+'&t='+t,{cache:'no-store'});if(!a.ok)throw Error('Update bundle HTTP '+a.status);
  const h=await a.text();if(!h||h.length<1000)throw Error('Update bundle is empty or incomplete');
  if((await sha256(h)).toLowerCase()!==String(m.sha256).toLowerCase())throw Error('Update integrity check failed');
  write(m.otaVersion,h);run(installDynamicUpdater(h));
 }catch(e){
  if(cached&&cached.html){status('Offline mode — using the last verified version.');setTimeout(()=>run(installDynamicUpdater(cached.html)),80);return}
  try{status('Starting the bundled version…');const r=await fetch(FALLBACK,{cache:'no-store'});if(!r.ok)throw Error('Bundled fallback HTTP '+r.status);const h=await r.text();if(!h||h.length<1000)throw Error('Bundled fallback is empty or incomplete');run(h)}catch(f){status('ResuMate could not start.');error.textContent=String(e.message||e)+'\n'+String(f.message||f)}}
}
load();
})();
</script>
</body>
</html>
