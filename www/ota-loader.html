<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ResuMate</title>
<style>html,body{margin:0;width:100%;height:100%;background:#fff;color:#181a1f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#ota-status{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.ota-card{max-width:420px}.ota-title{font-size:22px;font-weight:700;margin-bottom:8px}.ota-text{font-size:14px;line-height:1.5;color:#666}.ota-error{margin-top:12px;font-size:12px;color:#a33;white-space:pre-wrap;word-break:break-word}.ota-actions{margin-top:18px;display:none;gap:10px;justify-content:center}.ota-actions button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.ota-primary{background:#181a1f;color:#fff}.ota-secondary{background:#eee;color:#181a1f}</style>
</head>
<body>
<div id="ota-status"><div class="ota-card"><div class="ota-title">ResuMate</div><div class="ota-text" id="ota-text">Checking for the latest ResuMate update…</div><div class="ota-actions" id="ota-actions"><button class="ota-primary" id="ota-update">Full App Update</button><button class="ota-secondary" id="ota-continue">Continue Offline</button></div><div class="ota-error" id="ota-error"></div></div></div>
<script>
(function(){
  'use strict';
  const VERSION_URL='https://raw.githubusercontent.com/gba45684-lab/ResuMate2/ota/version.json';
  const APP_URL='https://raw.githubusercontent.com/gba45684-lab/ResuMate2/ota/index.html';
  const CACHE_KEY='resumate.ota.bundle.v4';
  const FALLBACK='fallback.html';
  const text=document.getElementById('ota-text');
  const error=document.getElementById('ota-error');
  const actions=document.getElementById('ota-actions');
  const updateBtn=document.getElementById('ota-update');
  const continueBtn=document.getElementById('ota-continue');
  const setStatus=(s,e)=>{text.textContent=s;if(e)error.textContent=e};
  const readCache=()=>{try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){return null}};
  const writeCache=(v,h)=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify({version:v,html:h}))}catch(_){} };
  async function sha256(value){const bytes=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}
  function run(html){document.open();document.write(html);document.close()}
  function nativeVersion(){try{if(window.ResuMateNative&&typeof window.ResuMateNative.getNativeVersion==='function')return window.ResuMateNative.getNativeVersion()||'0.0.0'}catch(_){}return '0.0.0'}
  function compare(a,b){const pa=String(a||'0.0.0').split('.').map(x=>parseInt(x,10)||0),pb=String(b||'0.0.0').split('.').map(x=>parseInt(x,10)||0);for(let i=0;i<3;i++){if((pa[i]||0)!==(pb[i]||0))return(pa[i]||0)>(pb[i]||0)?1:-1}return 0}
  function openFullUpdate(url){try{if(window.ResuMateNative&&typeof window.ResuMateNative.openExternalUrl==='function'){window.ResuMateNative.openExternalUrl(url);return true}}catch(_){}try{window.location.href=url;return true}catch(_){return false}}
  function showFullUpdate(url,reason){setStatus('Full App Update Available',reason||'Your installed app cannot safely use this update.');actions.style.display='flex';updateBtn.onclick=()=>openFullUpdate(url);continueBtn.onclick=()=>{actions.style.display='none';const cached=readCache();if(cached&&cached.html)run(cached.html);else{setStatus('Starting the bundled version…');fetch(FALLBACK,{cache:'no-store'}).then(r=>r.text()).then(run).catch(e=>setStatus('ResuMate could not start.',String(e.message||e)))}}}
  async function load(){
    const cached=readCache();
    let manifest=null;
    try{
      setStatus('Checking for the latest ResuMate update…');
      const stamp=Date.now();
      const manifestResponse=await fetch(VERSION_URL+'?t='+stamp,{cache:'no-store'});
      if(!manifestResponse.ok)throw new Error('Update manifest HTTP '+manifestResponse.status);
      manifest=await manifestResponse.json();
      if(!manifest.version||!manifest.sha256||!manifest.minimumNativeVersion||!manifest.apkUrl)throw new Error('Invalid update manifest');
      const nv=nativeVersion();
      if(compare(nv,manifest.minimumNativeVersion)<0){showFullUpdate(manifest.apkUrl,'Installed native version '+nv+' is below the required '+manifest.minimumNativeVersion+'.');return}
      if(cached&&cached.version===manifest.version&&cached.html){run(cached.html);return}
      setStatus('Downloading the latest ResuMate update…');
      const appResponse=await fetch(APP_URL+'?v='+encodeURIComponent(manifest.version)+'&t='+stamp,{cache:'no-store'});
      if(!appResponse.ok)throw new Error('Update bundle HTTP '+appResponse.status);
      const html=await appResponse.text();
      if(!html||html.length<1000)throw new Error('Update bundle is empty or incomplete');
      const actual=await sha256(html);
      if(actual.toLowerCase()!==String(manifest.sha256).toLowerCase())throw new Error('Update integrity check failed');
      writeCache(manifest.version,html);run(html);
    }catch(e){
      if(manifest&&manifest.apkUrl){showFullUpdate(manifest.apkUrl,'OTA update could not be safely applied. Install the newest full app to continue.');return}
      if(cached&&cached.html){setStatus('Offline mode — using the last verified update.');setTimeout(()=>run(cached.html),80);return}
      try{setStatus('Starting the bundled version…');const fallback=await fetch(FALLBACK,{cache:'no-store'});if(!fallback.ok)throw new Error('Bundled fallback HTTP '+fallback.status);const html=await fallback.text();if(!html||html.length<1000)throw new Error('Bundled fallback is empty or incomplete');run(html)}catch(f){setStatus('ResuMate could not start.',String(e&&e.message||e)+'\n'+String(f&&f.message||f))}
    }
  }
  load();
})();
</script>
</body>
</html>
