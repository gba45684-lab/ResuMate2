name: Build ResuMate Native APK

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Native APK version, e.g. 1.1.0"
        required: true
        default: "1.1.0"
        type: string
      version_code:
        description: "Android versionCode"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

env:
  NATIVE_APP_VERSION: ${{ inputs.version }}
  NATIVE_VERSION_CODE: ${{ inputs.version_code }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native Android bridge and Back behavior
        run: python3 scripts/patch-android.py

      - name: Hide Android status bar
        run: python3 scripts/patch-android-ui.py

      - name: Apply themed Android launcher icon
        run: python3 scripts/patch-android-icon.py

      - name: Set native version
        working-directory: android
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "{os.environ["NATIVE_APP_VERSION"]}"',
              s,
          )

          s = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {os.environ["NATIVE_VERSION_CODE"]}',
              s,
          )

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        run: |
          set -euo pipefail

          echo "Searching for generated APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

          APK="$(find android/app/build/outputs/apk -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated under android/app/build/outputs/apk"
            exit 1
          fi

          echo "Using APK: $APK"
          test -s "$APK"

          mkdir -p dist

          cp "$APK" "dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk"

          sha256sum "dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk" \
            | tee "dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk.sha256"

          echo "APK prepared successfully:"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResuMate2-${{ env.NATIVE_APP_VERSION }}
          path: "dist/*"

      - name: Publish native APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: native-${{ env.NATIVE_APP_VERSION }}
          name: ResuMate Native ${{ env.NATIVE_APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk
            dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk.sha256

      - name: Verify APK release asset
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: native-${{ env.NATIVE_APP_VERSION }}
          APK_NAME: ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG
            });

            const apk = release.data.assets.find(
              asset => asset.name === process.env.APK_NAME
            );

            if (!apk) {
              core.setFailed(
                `APK was NOT uploaded to release: ${process.env.APK_NAME}`
              );
              return;
            }

            core.info(`APK uploaded successfully: ${apk.name}`);
            core.info(`APK size: ${apk.size} bytes`);
            core.info(`Download URL: ${apk.browser_download_url}`);
