name: Build ResuMate Native APK

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Native APK version, e.g. 1.1.0"
        required: true
        default: "1.1.0"
        type: string
      version_code:
        description: "Android versionCode"
        required: true
        default: "2"
        type: string

permissions:
  contents: write

env:
  NATIVE_APP_VERSION: ${{ inputs.version }}
  NATIVE_VERSION_CODE: ${{ inputs.version_code }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify native build inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          version = os.environ["NATIVE_APP_VERSION"]
          version_code = os.environ["NATIVE_VERSION_CODE"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid native version: {version!r}")
          if not re.fullmatch(r"[1-9]\d*", version_code):
              raise SystemExit(f"Invalid Android versionCode: {version_code!r}")
          print(f"Validated native version={version}, versionCode={version_code}")
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native Android bridge and Back behavior
        run: python3 scripts/patch-android.py

      - name: Configure Android top black bar and status bar
        run: python3 scripts/patch-android-ui.py

      - name: Apply themed Android launcher icon
        run: python3 scripts/patch-android-icon.py

      - name: Set native version
        working-directory: android
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionName\s+"[^"]+"',
              f'versionName "{os.environ["NATIVE_APP_VERSION"]}"',
              s,
          )

          s = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {os.environ["NATIVE_VERSION_CODE"]}',
              s,
          )

          p.write_text(s, encoding="utf-8")
          PY

      # A release build without a configured release keystore produces
      # app-release-unsigned.apk. Build the Capacitor debug variant instead;
      # Android Gradle signs it automatically with the standard debug key.
      # This produces a valid sideload/test APK. Production Play distribution
      # should use a protected release keystore and an AAB.
      - name: Build signed installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature and package
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/debug -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

          test -s "$APK"
          echo "APK: $APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: Android apksigner not found."
            exit 1
          fi

          echo "Verifying APK cryptographic signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "Reading APK package metadata..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code "$APK"

          mkdir -p dist
          OUT="dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk"
          cp "$APK" "$OUT"

          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "Verified signed APK:"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResuMate2-${{ env.NATIVE_APP_VERSION }}
          path: "dist/*"

      - name: Publish native APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: native-${{ env.NATIVE_APP_VERSION }}
          name: ResuMate Native ${{ env.NATIVE_APP_VERSION }}
          generate_release_notes: true
          files: |
            dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk
            dist/ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk.sha256

      - name: Verify APK release asset
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: native-${{ env.NATIVE_APP_VERSION }}
          APK_NAME: ResuMate2-${{ env.NATIVE_APP_VERSION }}.apk
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG
            });

            const apk = release.data.assets.find(
              asset => asset.name === process.env.APK_NAME
            );

            if (!apk) {
              core.setFailed(
                `APK was NOT uploaded to release: ${process.env.APK_NAME}`
              );
              return;
            }

            core.info(`APK uploaded successfully: ${apk.name}`);
            core.info(`APK size: ${apk.size} bytes`);
            core.info(`Download URL: ${apk.browser_download_url}`);
