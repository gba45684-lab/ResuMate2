name: Publish ResuMate OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NATIVE_APP_VERSION: '1.1.0'

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify project structure
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/ota-loader.html
          test -f www/app-source.html
          test -f www/fallback.html
          test -f scripts/patch-web.py
          test -f scripts/patch-theme-preview.py
          test -f scripts/finalize-export-ui.py
          test -f scripts/bundle-runtime-libs.py
          test -f scripts/patch-theme-preview.py
          test ! -f index.html

      - name: Build verified OTA bundle
        run: |
          cp www/app-source.html www/index.html
          python3 scripts/patch-web.py
          python3 scripts/finalize-export-ui.py
          python3 scripts/bundle-runtime-libs.py
          python3 scripts/patch-theme-preview.py
          mkdir -p ota-publish
          cp www/index.html ota-publish/index.html
          sha256sum ota-publish/index.html | awk '{print $1}' > ota-publish/index.sha256
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          html = Path('ota-publish/index.html').read_bytes()
          sha = hashlib.sha256(html).hexdigest()
          version = os.environ.get('GITHUB_SHA', 'unknown')
          native = os.environ.get('NATIVE_APP_VERSION', '1.1.0')
          manifest = {
              'app': 'ResuMate2',
              'schemaVersion': 2,
              'appVersion': native,
              'otaVersion': version,
              'bundleVersion': version,
              'minWebVersion': '1.0.0',
              'sha256': sha,
              'generatedAt': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'channel': 'stable',
              'updateMode': 'auto',
              'autoApply': True,
              'pollIntervalMs': 300000,
              'rollbackEnabled': True,
              'features': {
                  'aiDoctor': True,
                  'ats': True,
                  'templates': True,
                  'tracker': True,
                  'interviewCoach': True,
                  'onlineUpdates': True
              }
          }
          Path('ota-publish/version.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
          cp www/ota-loader.html www/index.html

      - name: Publish OTA branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ota-publish-branch
          git rm -rf . >/dev/null 2>&1 || true
          cp ota-publish/index.html index.html
          cp ota-publish/version.json version.json
          git add index.html version.json
          git commit -m "Publish OTA web build ${GITHUB_SHA}" --allow-empty
          git push origin HEAD:ota --force
