name: Build ResuMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Verify clean project structure
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          test -f www/ota-loader.html
          test -f www/app-source.html
          test -f www/fallback.html
          test -f scripts/patch-web.py
          test -f scripts/patch-android.py
          test -f scripts/patch-android-ui.py
          test -f scripts/finalize-export-ui.py
          test -f scripts/bundle-runtime-libs.py
          test ! -f index.html

      - name: Prepare OTA web build
        run: |
          cp www/app-source.html www/index.html
          python3 scripts/patch-web.py
          python3 scripts/finalize-export-ui.py
          python3 scripts/bundle-runtime-libs.py
          mkdir -p ota-publish
          cp www/index.html ota-publish/index.html
          sha256sum ota-publish/index.html | awk '{print $1}' > ota-publish/index.sha256
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          html = Path('ota-publish/index.html').read_bytes()
          sha = hashlib.sha256(html).hexdigest()
          version = os.environ.get('GITHUB_SHA', 'unknown')
          manifest = {
              'version': version,
              'sha256': sha,
              'generatedAt': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'app': 'ResuMate2',
              'minNativeVersion': '1.0.0'
          }
          Path('ota-publish/version.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
          cp www/ota-loader.html www/index.html

      - name: Publish verified OTA bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ota:refs/remotes/origin/ota || true
          git checkout --orphan ota-publish-branch
          git rm -rf . >/dev/null 2>&1 || true
          cp ota-publish/index.html index.html
          cp ota-publish/version.json version.json
          git add index.html version.json
          git commit -m "Publish OTA web build ${GITHUB_SHA}" --allow-empty
          if git ls-remote --exit-code --heads origin ota >/dev/null 2>&1; then
            git push origin HEAD:ota --force
          else
            git push origin HEAD:ota
          fi
          git checkout --detach "${GITHUB_SHA}"

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply native Android bridge and Back behavior
        run: python3 scripts/patch-android.py

      - name: Hide Android status bar
        run: python3 scripts/patch-android-ui.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: resumate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
