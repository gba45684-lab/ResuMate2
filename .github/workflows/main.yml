name: Publish ResuMate OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NATIVE_APP_VERSION: '1.1.0'

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package lockfile
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push origin HEAD:main
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Regression checks
        run: python3 scripts/regression-check.py

      - name: Build web bundle
        run: python3 scripts/build-web.py

      - name: Post-build functional smoke checks
        run: python3 scripts/postbuild-smoke.py

      - name: OTA safety gate
        run: python3 scripts/ota-safety-check.py

      - name: OTA failure-injection rollback test
        run: python3 scripts/ota-failure-injection-test.py

      - name: Verify generated bundle
        run: |
          set -euo pipefail
          test -s www/index.html
          grep -q 'resumate-ota-status' www/index.html
          grep -q 'VERSION_URL' www/index.html
          grep -q 'ResuMateErrorEngine' www/index.html
          grep -q 'ResuMateDataProtection' www/index.html
          test ! -f index.html

      - name: Prepare OTA release
        run: |
          set -euo pipefail
          mkdir -p ota-publish
          cp www/index.html ota-publish/index.html
          sha256sum ota-publish/index.html | awk '{print $1}' > ota-publish/index.sha256
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          html = Path('ota-publish/index.html').read_bytes()
          sha = hashlib.sha256(html).hexdigest()
          version = os.environ.get('GITHUB_SHA', 'unknown')
          native = os.environ.get('NATIVE_APP_VERSION', '1.1.0')
          raw = subprocess.check_output(['git', 'log', '-8', '--pretty=format:%s'], text=True)
          whats_new = [line.strip() for line in raw.splitlines() if line.strip()]
          manifest = {
              'app': 'ResuMate2',
              'schemaVersion': 2,
              'appVersion': native,
              'version': version,
              'otaVersion': version,
              'bundleVersion': version,
              'minWebVersion': '1.0.0',
              'sha256': sha,
              'generatedAt': os.environ.get('GITHUB_RUN_STARTED_AT', ''),
              'channel': 'stable',
              'updateMode': 'auto',
              'autoApply': True,
              'pollIntervalMs': 300000,
              'rollbackEnabled': True,
              'dataProtection': True,
              'errorEngine': True,
              'whatsNew': whats_new,
              'features': {
                  'aiDoctor': True,
                  'ats': True,
                  'templates': True,
                  'tracker': True,
                  'interviewCoach': True,
                  'onlineUpdates': True
              }
          }
          Path('ota-publish/version.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish OTA branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ota-publish-branch
          git rm -rf . >/dev/null 2>&1 || true
          cp ota-publish/index.html index.html
          cp ota-publish/version.json version.json
          git add index.html version.json
          git commit -m "Publish OTA web build ${GITHUB_SHA}" --allow-empty
          git push origin HEAD:ota --force
